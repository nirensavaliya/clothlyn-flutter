allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.set(newSubprojectBuildDir)
}

// screen_protector 1.5.x applies kotlin-android only when AGP < 9.
// This app uses AGP 9 with android.builtInKotlin=false, so ScreenProtectorPlugin
// is never compiled unless we apply the Kotlin plugin ourselves.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        def builtInKotlin = (subproject.findProperty("android.builtInKotlin") ?: "true").toString().toBoolean()
        def hasKotlinPlugin = subproject.pluginManager.hasPlugin("org.jetbrains.kotlin.android") ||
                subproject.pluginManager.hasPlugin("kotlin-android")
        if (subproject.name == "screen_protector" && !builtInKotlin && !hasKotlinPlugin) {
            subproject.pluginManager.apply("org.jetbrains.kotlin.android")
        }
    }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.extensions.findByName("android") != null) {
            subproject.android {
                compileSdk = 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }

    subproject.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }

    subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}